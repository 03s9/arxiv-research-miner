name: tests

"on":
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: offline-unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run offline unit tests
        run: MULTISOURCE_OFFLINE=1 PYTHONPATH=. python3 -m unittest discover -s tests
